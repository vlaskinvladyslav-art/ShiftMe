<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<!-- interactive-widget=resizes-content was tried here to fix the
     keyboard-gap bug, but on this iOS PWA it caused a worse regression: a
     permanent dim "chin" at the bottom of every fixed-position window, even
     with no keyboard open at all (the browser appears to permanently
     reserve chrome space rather than only while the keyboard is up).
     Reverted — the body scroll-lock in core/scrollLock.js is the real fix
     for the background-scrolling part of that bug; the keyboard-gap itself
     needs a different, more surgical approach (e.g. the visualViewport API)
     if it's still an issue. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>ShiftMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="icon" href="./icons/favicon.ico" sizes="48x48" />
<link rel="icon" href="./icons/pwa-64x64.png" type="image/png" sizes="64x64" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180x180.png" />
<meta name="theme-color" content="#03040a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- black-translucent is deprecated (Apple has flagged it for removal) and
     has documented reports of causing exactly this kind of bottom safe-area
     layout glitch in standalone PWAs — it makes the status bar translucent
     by letting page content render underneath/through it, which apparently
     also disturbs how the OS computes the reserved space at the OTHER end
     of the screen in some iOS versions. Switched to "black": an opaque bar
     instead of a see-through one — a real (minor) visual change, but this
     is the most direct lead found yet for the bottom "chin" that persisted
     through every CSS-only attempt. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="ShiftMe" />
<!-- Launch cover: the same background as the splash (App.css .splash), styled
     inline so it is there on the very first paint, before any CSS/JS. main.js
     hides it once the splash is mounted, and shows it again whenever the app
     goes to the background — iOS photographs the screen at that moment and
     flashes that photo on the next launch, so the "phantom frame" is this
     cover (= the splash's background) instead of a stale page / lock screen. -->
<style>#launch-cover{z-index:5000;pointer-events:none;opacity:1;background-color:#14171c;background-image:radial-gradient(circle at 15% 10%,#ff8c421a,#0000 45%),radial-gradient(circle at 85% 90%,#43c6ac17,#0000 45%);background-position:0 0;background-repeat:repeat;background-size:auto;background-attachment:scroll;background-origin:padding-box;background-clip:border-box;transition:opacity .25s;position:fixed;inset:0}#launch-cover.off{opacity:0}#launch-cover.gone{visibility:hidden}html{background:#14171c}</style>
  <script type="module" crossorigin src="./assets/index-DT52o5tE.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/preload-helper-uBIymjUX.js">
  <link rel="modulepreload" crossorigin href="./assets/localStore-BxmdoaQ_.js">
  <link rel="modulepreload" crossorigin href="./assets/firebase-CMIk-uMt.js">
  <link rel="modulepreload" crossorigin href="./assets/firebase-ngalauSp.js">
  <link rel="stylesheet" crossorigin href="./assets/index-B5v9kQcy.css">
<link rel="manifest" href="./manifest.webmanifest"></head>
<body>
<div id="launch-cover"></div>
<div id="app"></div>
</body>
</html>
